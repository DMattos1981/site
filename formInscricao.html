<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Inscrição</title>
</head>
<body>
    <header>
        <h1>Formulário para Inscrição</h1>
    </header>

    <section id="formulario">
        <h2>Inscreva-se Já</h2>

        <form action="">
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" required> <br>

            <label for="email">E-mail: </label>
            <input type="email" name="email" id="email" required> <br>

            <label for="materia">Matéria: </label>
            <select name="materia" id="materia" required>
                <option value="" disabled selected hidden>-- Selecione uma matéria --</option>
                <option value="Matemática">Matemática</option>
                <option value="Português">Português</option>
                <option value="Biologia">Biologia</option>
                <option value="Ciências">Ciências</option>
                <option value="História">História</option>
                <option value="Geografia">Geografia</option>
                <option value="Artes">Artes</option>
            </select> <br>

            <label for="escolaridade">Escolaridade: </label>
            <select name="escolaridade" id="escolaridade" required>
                <option value="" disabled selected hidden>-- Selecione uma Escolaridade --</option>
                <option value="Ensino Superior Completo">Ensino Superior Completo</option>
                <option value="Cursando Mestrado">Cursando Mestrado</option>
                <option value="Mestrado Completo">Mestrado Completo</option>
                <option value="Cursando Doutorado">Cursando Doutorado</option>
                <option value="Doutorado Completo">Doutorado Completo</option>
            </select> <br>

            <label for="descricao">Descrição sobre si mesmo:</label>
            <textarea name="descricao" id="descricao" cols="20" rows="5"></textarea> <br>

            <input type="submit" value="Enviar Inscrição">
        </form>

    </section>
</body>
</html>
